
apiVersion: apps/v1
kind: Deployment

metadata:
  name: github-actions-poc
  namespace: github-actions-poc

spec:
  replicas: 1

  selector:
    matchLabels:
      app: github-actions-poc

  template:
    metadata:
      labels:
        app: github-actions-poc

    spec:
      containers:
        - name: github-actions-poc
          image: ghcr.io/lravikumarl112-tech/github-actions-poc:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
              name: http



name: Secure Node.js CI and Docker Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Test, Scan, Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run application tests
        working-directory: app
        run: npm test

      - name: Audit Node.js dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/lravikumarl112-tech/github-actions-poc:${{ github.sha }}
            ghcr.io/lravikumarl112-tech/github-actions-poc:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lravikumarl112-tech/github-actions-poc:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/lravikumarl112-tech/github-actions-poc:${{ github.sha }}
          docker push ghcr.io/lravikumarl112-tech/github-actions-poc:latest
